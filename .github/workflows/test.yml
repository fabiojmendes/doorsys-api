name: Test

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: doorsys-test
          POSTGRES_DB: doorsys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doorsys_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:doorsys-test@localhost:5432/doorsys_test
      # Compile query macros from checked-in metadata; tests still use PostgreSQL.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # sqlx::test creates isolated databases and applies migrations automatically.
      - name: Run tests
        run: cargo test --locked --all-targets
